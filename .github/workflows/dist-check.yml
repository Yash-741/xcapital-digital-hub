name: dist-check

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  dist-check:
    name: dist-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run dist check
        run: bun run dist-check